name: Rebuild release candidate (manual, no publish)

# Manual, read-only rebuild of the exact PDF/EPUB on the pinned macOS 15 ARM64
# runner, followed by the same format validators publication CI uses.
#
# It never commits, never publishes, and never touches a gate: it only uploads
# an artifact bundle so a maintainer can verify the bytes and then update
# book/references/release-evidence.md, book/references/rights-materials-inventory.md
# and book/references/external-release-gates.json by hand.
#
# It always rebuilds from the trusted `main` ref, per .github/AGENTS.md.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Reason or ticket for this rebuild (recorded in the draft evidence)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-rebuild
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TYPST_IGNORE_SYSTEM_FONTS: "true"
  TYPST_FONT_PATHS: ${{ github.workspace }}/build/ci-tools/inter/extras/otf
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  rebuild:
    name: Rebuild and validate the release candidate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the trusted main ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Load pinned veraPDF contract
        run: |
          PYTHONPATH=scripts python -c 'import os; from pathlib import Path; from verapdf_validation import VERAPDF_INSTALLER_SHA256, VERAPDF_INSTALLER_URL, VERAPDF_VERSION; print(f"VERAPDF_VERSION={VERAPDF_VERSION}"); print(f"VERAPDF_INSTALLER_URL={VERAPDF_INSTALLER_URL}"); print(f"VERAPDF_INSTALLER_SHA256={VERAPDF_INSTALLER_SHA256}"); print("VERAPDF_HOME=" + str(Path(os.environ["RUNNER_TEMP"]) / ("streamentry-verapdf-" + VERAPDF_VERSION)))' >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Install PDF inspection tools
        run: brew install poppler

      - name: Install pinned publication tools
        env:
          TYPST_SHA256: fe53838737abf93a774495952a1a797b4686e9c4a21c2d99b9fdf77f46cc3572
          INTER_SHA256: ff970a5d4561a04f102a7cb781adbd6ac4e9b6c460914c7a101f15acb7f7d1a4
          EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5
          CHROME_BUILD_ID: 148.0.7778.97
          CHROME_SHA256: 20f0155e9d75a31d32d168691110cd8fbc4d66f75dc6d7a53c004cbea60290b9
        run: |
          mkdir -p build/ci-tools
          cd build/ci-tools

          curl --fail --silent --show-error --location \
            https://github.com/typst/typst/releases/download/v0.15.0/typst-aarch64-apple-darwin.tar.xz \
            --output typst.tar.xz
          printf '%s  %s\n' "$TYPST_SHA256" typst.tar.xz | shasum -a 256 --check
          tar -xJf typst.tar.xz

          curl --fail --silent --show-error --location \
            https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip \
            --output inter.zip
          printf '%s  %s\n' "$INTER_SHA256" inter.zip | shasum -a 256 --check
          unzip -q inter.zip -d inter

          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_BUILD_ID/mac-arm64/chrome-mac-arm64.zip" \
            --output chrome.zip
          printf '%s  %s\n' "$CHROME_SHA256" chrome.zip | shasum -a 256 --check
          chrome_dir="$PUPPETEER_CACHE_DIR/chrome/mac_arm-$CHROME_BUILD_ID"
          mkdir -p "$chrome_dir"
          ditto -x -k chrome.zip "$chrome_dir"

          curl --fail --silent --show-error --location \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip \
            --output epubcheck.zip
          printf '%s  %s\n' "$EPUBCHECK_SHA256" epubcheck.zip | shasum -a 256 --check
          unzip -q epubcheck.zip

          curl --fail --silent --show-error --location \
            "$VERAPDF_INSTALLER_URL" \
            --output verapdf.zip
          printf '%s  %s\n' "$VERAPDF_INSTALLER_SHA256" verapdf.zip | shasum -a 256 --check
          unzip -q verapdf.zip -d verapdf-installer
          sed "s|@INSTALL_PATH@|$VERAPDF_HOME|" \
            "$GITHUB_WORKSPACE/ci/verapdf-auto-install.xml" \
            > verapdf-auto-install.xml
          "verapdf-installer/verapdf-greenfield-$VERAPDF_VERSION/verapdf-install" \
            "$GITHUB_WORKSPACE/build/ci-tools/verapdf-auto-install.xml"

          printf '%s\n' \
            "$GITHUB_WORKSPACE/build/ci-tools/typst-aarch64-apple-darwin" \
            >> "$GITHUB_PATH"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement ci/requirements.txt
          npm ci --prefix ci
          npm audit --prefix ci --audit-level=high
          node ci/test-safe-extract-zip.js

      - name: Verify tool versions
        run: |
          typst_version="$(typst --version)"
          printf '%s\n' "$typst_version"
          case "$typst_version" in
            "typst 0.15.0"|"typst 0.15.0 "*) ;;
            *) exit 1 ;;
          esac
          test "$(ci/node_modules/.bin/ace-cli --version)" = "1.4.6"
          "$VERAPDF_HOME/verapdf" --version
          java -version
          pdfinfo -v

      - name: Load canonical artifact paths
        run: |
          PYTHONPATH=scripts python -c 'from edition_contract import EDITION; print(f"PDF_PATH={EDITION.pdf_relative_path.as_posix()}"); print(f"EPUB_PATH={EDITION.epub_relative_path.as_posix()}")' >> "$GITHUB_ENV"

      - name: Rebuild synchronized PDF and EPUB
        run: |
          mkdir -p build/release-rebuild
          python scripts/build-epub.py 2>&1 | tee build/release-rebuild/build.log

      - name: Validate PDF/UA-1 with the pinned veraPDF
        id: verapdf
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/verify-verapdf.py \
            --verapdf "$VERAPDF_HOME/verapdf" \
            --report-output build/release-rebuild/verapdf-report.json \
            2>&1 | tee build/release-rebuild/verapdf.log

      - name: Run EPUBCheck 5.3.0
        id: epubcheck
        continue-on-error: true
        run: |
          set -o pipefail
          java -jar build/ci-tools/epubcheck-5.3.0/epubcheck.jar "$EPUB_PATH" \
            2>&1 | tee build/release-rebuild/epubcheck.log

      - name: Run DAISY Ace 1.4.6
        id: ace
        continue-on-error: true
        run: |
          set -o pipefail
          ci/node_modules/.bin/ace-cli \
            --exiterror2 \
            --outdir build/release-rebuild/ace-report \
            "$EPUB_PATH" \
            2>&1 | tee build/release-rebuild/ace.log

      - name: Write the candidate evidence draft
        env:
          REBUILD_NOTE: ${{ inputs.note }}
          VERAPDF_STATUS: ${{ steps.verapdf.outcome }}
          EPUBCHECK_STATUS: ${{ steps.epubcheck.outcome }}
          ACE_STATUS: ${{ steps.ace.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          pdf = Path(os.environ["PDF_PATH"])
          epub = Path(os.environ["EPUB_PATH"])
          log = Path("build/release-rebuild/build.log").read_text(encoding="utf-8")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          info = subprocess.run(["pdfinfo", str(pdf)], capture_output=True, text=True).stdout
          pages = re.search(r"^Pages:\s+(\d+)", info, re.MULTILINE)
          nav = re.search(r"Navigation entries:\s+(\d+)", log)
          warnings = re.search(r"Acknowledged (\d+) known Typst", log)

          def status(name):
              value = os.environ.get(name + "_STATUS", "unknown")
              return "Pass" if value == "success" else "Not passing (" + value + ")"

          lines = [
              "# Release candidate evidence draft (manual rebuild, do not auto-commit)",
              "",
              "Values below are raw machine output from one rebuild. Read the files in",
              "`build/release-rebuild/` and re-run the reviewer gates before copying anything",
              "into the committed release record. This draft is not external validation and",
              "it closes no gate.",
              "",
              "| Field | Value |",
              "| --- | --- |",
              "| Trigger note | " + os.environ.get("REBUILD_NOTE", "") + " |",
              "| Commit | `" + os.environ.get("GITHUB_SHA", "") + "` |",
              "| Runner | " + os.environ.get("RUNNER_OS", "") + " / " + os.environ.get("RUNNER_ARCH", "") + " |",
              "| PDF | " + (pages.group(1) if pages else "?") + " A5 pages; " + str(pdf.stat().st_size) + " bytes |",
              "| PDF SHA-256 | `" + sha256(pdf) + "` |",
              "| EPUB | " + str(epub.stat().st_size) + " bytes; " + (nav.group(1) if nav else "?") + " nested navigation entries plus 1 cover entry |",
              "| EPUB SHA-256 | `" + sha256(epub) + "` |",
              "| Immutable source SHA-256 | read from book/edition.json |",
              "| Typst HTML-export warnings acknowledged | " + (warnings.group(1) if warnings else "?") + " |",
              "| veraPDF PDF/UA-1 | " + status("VERAPDF") + " |",
              "| EPUBCheck 5.3.0 | " + status("EPUBCHECK") + " |",
              "| DAISY Ace 1.4.6 | " + status("ACE") + " |",
              "",
          ]
          Path("build/release-rebuild/release-candidate-evidence-draft.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY

      - name: Upload the rebuild bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-rebuild-${{ github.sha }}
          path: |
            dist/huong-den-nhap-luu.pdf
            dist/huong-den-nhap-luu.epub
            build/release-rebuild/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the validator results
        if: always()
        run: |
          failed=0
          for entry in "veraPDF:${{ steps.verapdf.outcome }}" \
                       "EPUBCheck:${{ steps.epubcheck.outcome }}" \
                       "DAISY Ace:${{ steps.ace.outcome }}"; do
            name="${entry%%:*}"
            outcome="${entry##*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::${name} did not pass (outcome: ${outcome}); inspect the uploaded bundle."
              failed=1
            fi
          done
          exit "$failed"
